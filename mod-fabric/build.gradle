import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "com.github.glitchfiend:TerraBlender-fabric:${minecraft_version}-${terrablender_version}"
    implementation "com.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    implementation "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-$resourcefulconfig_minecraft_version:$resourcefulconfig_version"
}

loom {
    def aw = project(':mod-common').file("src/main/resources/${mod_id}.accesswidener")

    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }

        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

sourceSets.main.resources { srcDir project.project(':mod-common').file('src/generated/resources/').getAbsolutePath() }

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = rootProject.findProperty('curseforge_token')
    debugMode = false

    var mainFile = upload(curseforge_project, tasks.jar)
    mainFile.changelog = rootProject.file(mod_changelog_file)
    mainFile.changelogType = 'markdown'
    mainFile.displayName = "${mod_name} ${version} - Fabric ${minecraft_version}"
    mainFile.releaseType = 'release'
    mainFile.addRequirement('fabric-api')
    mainFile.addRequirement('terrablender-fabric')
    mainFile.addRequirement('geckolib')
    mainFile.addRequirement('resourceful-config')
    mainFile.addModLoader('Fabric')
}

modrinth {
    token = rootProject.findProperty('modrinth_token').toString()
    debugMode = false

    projectId = modrinth_project
    versionName = "${mod_name} ${version} - Fabric ${minecraft_version}"
    changelog = rootProject.file(mod_changelog_file).getText()
    uploadFile = tasks.jar
    versionType = 'release'
    gameVersions = [minecraft_version]
    loaders = ['fabric']

    dependencies {
        required.project 'fabric-api'
        required.project 'terrablender'
        required.project 'geckolib'
        required.project 'resourceful-config'
    }
}