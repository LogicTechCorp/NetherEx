plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false

    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false

    id 'com.matyrobbrt.mc.registrationutils' version "$regutils_version"

    id 'net.darkhax.curseforgegradle' version "$curseforge_gradle_version" apply(false)
    id 'com.modrinth.minotaur' version "$minotaur_version" apply(false)
}

registrationUtils {
    group 'logictechcorp.netherex.platform.registration'

    projects {
        create('common') {
            type 'common'
            project ':mod-common'
        }
        create('fabric') {
            type 'fabric'
            project ':mod-fabric'
        }
        create('neoforge') {
            type 'neoforge'
            project ':mod-neoforge'
        }
    }
}